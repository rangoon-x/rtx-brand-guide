<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rangoon.Tech Brand CDN</title>
    <style>
      :root {
        color-scheme: light;
        --rtx-midnight: #021a26;
        --rtx-mint: #29ddb9;
        --rtx-soft: #f7fbfa;
        --rtx-muted: rgba(2, 26, 38, 0.68);
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--rtx-soft);
        color: var(--rtx-midnight);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(720px, calc(100% - 40px));
      }

      h1 {
        margin: 0;
        font-size: clamp(36px, 7vw, 72px);
        line-height: 1.05;
      }

      p {
        margin: 20px 0 0;
        color: var(--rtx-muted);
        font-size: 17px;
        line-height: 1.55;
      }

      ul {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 0;
        margin: 32px 0 0;
        list-style: none;
      }

      a {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        border: 1px solid rgba(2, 26, 38, 0.14);
        border-radius: 999px;
        padding: 0 16px;
        color: var(--rtx-midnight);
        font-weight: 700;
        text-decoration: none;
      }

      a.primary {
        border-color: var(--rtx-mint);
        background: var(--rtx-mint);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Rangoon.Tech Brand CDN</h1>
      <p>Versioned static brand assets for the Rangoon.Tech Brand Guide.</p>
      <ul>
        <li><a class="primary" href="./v1/">Open v1</a></li>
        <li><a href="./v1/manifest.json">Manifest</a></li>
        <li><a href="./v1/styles/fonts.css">Fonts CSS</a></li>
      </ul>
    </main>
  </body>
</html>
